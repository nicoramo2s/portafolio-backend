<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/form-style.css">

    <title>Formulario</title>
</head>

<body>
    <header>
        <div class="container">
            <div th:insert="~{fragments/nav-admin :: nav-admin}"></div>
        </div>
    </header>
    <main>
        <div class="container">
            <section id="contact">
                <div class="admin-actions">
                    <button class="btn-back" th:onclick="|window.location.href='@{/projects}'|">Volver a la lista de
                        Proyectos</button>
                    <form th:action="@{/logout}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="logout-link">Cerrar Sesión</button>
                    </form>
                </div>
                <h2>Formulario de Proyectos</h2>
                <form class="contact-form" th:action="@{/projects/save}" th:object="${projectDto}" method="post"
                    enctype="multipart/form-data">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <input type="text" id="title" th:field="*{title}" placeholder="Titulo del Proyecto">
                    <div class="error-message" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>

                    <textarea id="description" th:field="*{description}"
                        placeholder="Descripción del Proyecto"></textarea>
                    <div class="error-message" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">
                    </div>

                    <input type="text" id="projectUrl" th:field="*{projectUrl}" placeholder="Url del Proyecto">
                    <div class="error-message" th:if="${#fields.hasErrors('projectUrl')}" th:errors="*{projectUrl}">
                    </div>

                    <label for="file">Imagen del Proyecto: </label>
                    <input id="file" type="file" name="file">
                    <div class="error-message" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></div>

                    <input type="text" id="personalInfoId" th:field="*{personalInfoId}"
                        placeholder="ID Información Personal">
                    <div class="error-message" th:if="${#fields.hasErrors('personalInfoId')}"
                        th:errors="*{personalInfoId}"></div>

                    <button type="submit">Guardar Proyecto</button>
                </form>
            </section>
        </div>
    </main>

    <div th:insert="~{fragments/footer :: footer}"></div>
</body>

</html>
