<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<section class="hero-section" th:fragment="hero">
    <h1>I'm <span th:text="${personalInfo.firstName} + ' ' + ${personalInfo.lastName}"></span> <br><span
            th:text="${personalInfo.title}"></span></h1>
    <div class="profile-image-container">
        <img th:src="${personalInfo.profileImageUrl}" th:alt="${personalInfo.firstName + ' Profile Picture'}"
            class="profile-picture">
    </div>
    <p th:text="${personalInfo.profileDescription}"></p>

    <button><a href="#projects">MY PROJECTS</a></button>
</section>

</html>
