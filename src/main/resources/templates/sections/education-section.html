<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Title</title>
</head>
<body>
<section id="education" th:fragment="education">
    <h2>MY EDUCATION</h2>
    <div class="education-timeline" th:each="edu : ${educationList}">
        <div class="timeline-item">
            <h3 th:text="${edu.degree} + ' - ' + ${edu.institution}"></h3>
            <p class="timeline-date" th:text="${edu.startDate} + ' - ' + ${edu.endDate}"></p>
            <p th:text="${edu.description}"></p>
        </div>
    </div>
</section>
</body>
</html>
