<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de Habilidad</title>
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/form-style.css">
</head>

<body>

    <header>
        <div class="container">
            <th:block th:replace="~{fragments/nav-admin :: nav-admin}"></th:block>
        </div>
    </header>

    <main>
        <div class="container">
            <section class="admin-section">
                <div class="admin-actions">
                    <a th:href="@{/skills}">Volver a la lista de Habilidades</a>
                    <a th:href="@{/logout}">Cerrar Sesión</a>
                </div>
                <h2>Formulario de Habilidad</h2>

                <form class="contact-form" method="post" th:action="@{/skills/save}" th:object="${skillDto}">
                    <input type="hidden" th:field="*{id}" />

                    <input type="text" placeholder="Nombre de la habilidad" required th:field="*{name}" />
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error-message"></div>

                    <input type="number" placeholder="Porcentaje (0-100)" required min="0" max="100"
                        th:field="*{levelPercentage}" />
                    <div th:if="${#fields.hasErrors('levelPercentage')}" th:errors="*{levelPercentage}"
                        class="error-message"></div>

                    <input type="text" placeholder="Clase del ícono (ej. fas fa-code)" required
                        th:field="*{iconClass}" />
                    <div th:if="${#fields.hasErrors('iconClass')}" th:errors="*{iconClass}" class="error-message"></div>

                    <input type="number" placeholder="ID Información Personal" required th:field="*{personalInfoId}" />
                    <div th:if="${#fields.hasErrors('personalInfoId')}" th:errors="*{personalInfoId}"
                        class="error-message"></div>

                    <button type="submit" class="btn">Guardar Habilidad</button>
                </form>
            </section>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>

</body>

</html>
